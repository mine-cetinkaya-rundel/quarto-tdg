<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">A figure and a table side by side</title>
  <desc id="svg-desc">Two placeholders, CONTENT 1 and CONTENT 2, side by side. Each is outlined as its own cross-referenceable element, with its own numbered caption: Figure 1: Caption 1 and Table 1: Caption 2.</desc>
  <rect x="0" y="0" width="1200" height="554" fill="#ececec"/>
  <rect x="150" y="140" width="400" height="280" fill="#fff" stroke="#999" stroke-width="3"/><text x="350" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="central">CONTENT 1</text>
  <rect x="650" y="140" width="400" height="280" fill="#fff" stroke="#999" stroke-width="3"/><text x="850" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="central">CONTENT 2</text>
  <text x="150" y="484" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#222" text-anchor="start"><tspan font-weight="bold">Figure 1:</tspan> Caption 1</text>
  <text x="650" y="484" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#222" text-anchor="start"><tspan font-weight="bold">Table 1:</tspan> Caption 2</text>
  <rect x="120" y="110" width="460" height="404" rx="8" fill="none" stroke="#2e5090" stroke-width="4" stroke-dasharray="16 10"/><text x="132" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#2e5090">#fig-1</text>
  <rect x="620" y="110" width="460" height="404" rx="8" fill="none" stroke="#2e5090" stroke-width="4" stroke-dasharray="16 10"/><text x="632" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#2e5090">#tbl-1</text>
</svg>
