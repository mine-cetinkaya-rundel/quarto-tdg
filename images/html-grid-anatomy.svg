<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1687" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">The HTML page grid at three screen widths</title>
  <desc id="svg-desc">Three browser windows of decreasing width, stacked vertically at the same scale. Each shows a grey block labelled .column-body, a pink block labelled .column-margin, and a blue block labelled .column-page. In the widest window, labelled 992px and wider, brackets above the page mark body-width over the body column, gutter-width over the gap between body and margin, margin-width over the margin column, and a dashed sidebar-width bracket over the short distance the blue block extends left of the body. In the middle window, labelled 768px to 991px, the margin column remains but the blue block no longer extends left of the body. In the narrowest window, labelled narrower than 768px, there is a single column: the pink margin note sits above the body block and the blue block is the same width as the body.</desc>
  <rect width="1480" height="1687" fill="#ececec"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="30" fill="#222" stroke="none">
  <style>.title { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 32px; font-weight: 600; } .cls { font-size: 22px; fill: #333; text-anchor: middle; dominant-baseline: central; }</style>
    <text class="title" x="40.0" y="58.0">992px and wider</text>
    <image x="40.0" y="196.0" width="1400" height="383.0" href="data:image/png;base64,"/>
    <rect x="40.0" y="196.0" width="1400" height="383.0" fill="none" stroke="#333" stroke-width="4"/>
    <text class="cls" x="667.5" y="289.0">.column-body</text>
    <text class="cls" x="1200.0" y="260.0">.column-margin</text>
    <text class="cls" x="740.0" y="386.0">.column-page</text>
    <line x1="172.5" y1="172.0" x2="172.5" y2="579.0" stroke="#888" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="242.5" y1="172.0" x2="242.5" y2="579.0" stroke="#888" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="268.0" y1="172.0" x2="268.0" y2="579.0" stroke="#888" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="1067.0" y1="172.0" x2="1067.0" y2="579.0" stroke="#888" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="1092.5" y1="172.0" x2="1092.5" y2="579.0" stroke="#888" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="1307.5" y1="172.0" x2="1307.5" y2="579.0" stroke="#888" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M 172.5,172.0 L 242.5,172.0 M 172.5,160.0 L 172.5,184.0 M 242.5,160.0 L 242.5,184.0" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="242.5" y="102.0" text-anchor="end">sidebar-width</text>
    <line x1="238.5" y1="110.0" x2="207.5" y2="158.0" stroke="#444" stroke-width="2"/>
    <path d="M 268.0,172.0 L 1067.0,172.0 M 268.0,160.0 L 268.0,184.0 M 1067.0,160.0 L 1067.0,184.0" fill="none" stroke="#444" stroke-width="3"/>
    <text x="667.5" y="148.0" text-anchor="middle">body-width</text>
    <path d="M 1067.0,172.0 L 1092.5,172.0 M 1067.0,160.0 L 1067.0,184.0 M 1092.5,160.0 L 1092.5,184.0" fill="none" stroke="#444" stroke-width="3"/>
    <text x="1067.0" y="102.0" text-anchor="middle">gutter-width</text>
    <line x1="1067.0" y1="110.0" x2="1079.8" y2="158.0" stroke="#444" stroke-width="2"/>
    <path d="M 1092.5,172.0 L 1307.5,172.0 M 1092.5,160.0 L 1092.5,184.0 M 1307.5,160.0 L 1307.5,184.0" fill="none" stroke="#444" stroke-width="3"/>
    <text x="1200.0" y="148.0" text-anchor="middle">margin-width</text>
    <text class="title" x="290.0" y="667.0">768px to 991px</text>
    <image x="290.0" y="685.0" width="900" height="383.0" href="data:image/png;base64,"/>
    <rect x="290.0" y="685.0" width="900" height="383.0" fill="none" stroke="#333" stroke-width="4"/>
    <text class="cls" x="632.5" y="778.0">.column-body</text>
    <text class="cls" x="1057.0" y="749.0">.column-margin</text>
    <text class="cls" x="740.0" y="875.0">.column-page</text>
    <text class="title" x="440.0" y="1156.0">Narrower than 768px</text>
    <image x="440.0" y="1174.0" width="600" height="473.0" href="data:image/png;base64,"/>
    <rect x="440.0" y="1174.0" width="600" height="473.0" fill="none" stroke="#333" stroke-width="4"/>
    <text class="cls" x="740.0" y="1357.0">.column-body</text>
    <text class="cls" x="740.0" y="1238.0">.column-margin</text>
    <text class="cls" x="740.0" y="1454.0">.column-page</text>
  </g>
</svg>
