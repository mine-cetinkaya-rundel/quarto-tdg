<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="748" viewBox="0 0 1200 748" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">One figure with two sub-figures</title>
  <desc id="svg-desc">One outer figure containing two inner sub-figures side by side, containing CONTENT 1 and CONTENT 2. Each sub-figure has a lettered sub-caption, (a) Sub-caption 1 and (b) Sub-caption 2. A single caption below both reads Figure 1: Main caption.</desc>
  <rect x="0" y="0" width="1200" height="748" fill="#ececec"/>
  <rect x="150" y="240" width="400" height="280" fill="#fff" stroke="#999" stroke-width="3"/><text x="350" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="central">CONTENT 1</text>
  <rect x="650" y="240" width="400" height="280" fill="#fff" stroke="#999" stroke-width="3"/><text x="850" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="central">CONTENT 2</text>
  <text x="350" y="584" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#222" text-anchor="middle"><tspan font-weight="bold">(a)</tspan> Sub-caption 1</text>
  <text x="850" y="584" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#222" text-anchor="middle"><tspan font-weight="bold">(b)</tspan> Sub-caption 2</text>
  <rect x="120" y="210" width="460" height="404" rx="8" fill="none" stroke="#2e5090" stroke-width="4" stroke-dasharray="16 10"/><text x="132" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#2e5090">#fig-sub1</text>
  <rect x="620" y="210" width="460" height="404" rx="8" fill="none" stroke="#2e5090" stroke-width="4" stroke-dasharray="16 10"/><text x="632" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#2e5090">#fig-sub2</text>
  <text x="150" y="678" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#222" text-anchor="start"><tspan font-weight="bold">Figure 1:</tspan> Main caption</text>
  <rect x="90" y="110" width="1020" height="598" rx="8" fill="none" stroke="#2e5090" stroke-width="4" stroke-dasharray="16 10"/><text x="102" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#2e5090">#fig-main</text>
</svg>
