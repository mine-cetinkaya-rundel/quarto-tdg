<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">A figure and a table side by side</title>
  <desc id="svg-desc">A figure and a table side by side. Each is outlined as its own cross-referenceable element, with its own numbered caption: Figure 1: Caption 1 and Table 1: Caption 2.</desc>
  <rect x="0" y="0" width="1200" height="640" fill="#ececec"/>
  <rect x="150" y="110" width="400" height="280" fill="#fff" stroke="#999" stroke-width="3"/><circle cx="460" cy="190" r="28" fill="#ccc"/><path d="M 190 360 L 300 220 L 380 310 L 430 260 L 510 360 z" fill="#ccc"/>
  <rect x="650" y="110" width="400" height="280" fill="#fff"/>
  <rect x="650" y="110" width="400" height="56" fill="#ddd"/>
  <line x1="650" y1="166" x2="1050" y2="166" stroke="#ccc" stroke-width="3"/>
  <line x1="650" y1="222" x2="1050" y2="222" stroke="#ccc" stroke-width="3"/>
  <line x1="650" y1="278" x2="1050" y2="278" stroke="#ccc" stroke-width="3"/>
  <line x1="650" y1="334" x2="1050" y2="334" stroke="#ccc" stroke-width="3"/>
  <line x1="783" y1="110" x2="783" y2="390" stroke="#ccc" stroke-width="3"/>
  <line x1="917" y1="110" x2="917" y2="390" stroke="#ccc" stroke-width="3"/>
  <rect x="650" y="110" width="400" height="280" fill="none" stroke="#999" stroke-width="3"/>
  <text x="150" y="450" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#222" text-anchor="start"><tspan font-weight="bold">Figure 1:</tspan> Caption 1</text>
  <text x="650" y="450" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#222" text-anchor="start"><tspan font-weight="bold">Table 1:</tspan> Caption 2</text>
  <rect x="120" y="80" width="460" height="400" rx="8" fill="none" stroke="#2e5090" stroke-width="4" stroke-dasharray="16 10"/><text x="130" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="28" fill="#2e5090">#fig-1</text>
  <rect x="620" y="80" width="460" height="400" rx="8" fill="none" stroke="#2e5090" stroke-width="4" stroke-dasharray="16 10"/><text x="630" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="28" fill="#2e5090">#tbl-1</text>
</svg>
