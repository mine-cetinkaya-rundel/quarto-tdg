<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="614" viewBox="0 0 1200 614" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">One figure containing two pieces of content</title>
  <desc id="svg-desc">One figure outlined around two placeholders, CONTENT 1 and CONTENT 2, that sit side by side. Neither has a caption. A single caption below reads Figure 1: Main caption.</desc>
  <rect x="0" y="0" width="1200" height="614" fill="#ececec"/>
  <rect x="150" y="170" width="400" height="280" fill="#fff" stroke="#999" stroke-width="3"/><text x="350" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="central">CONTENT 1</text>
  <rect x="650" y="170" width="400" height="280" fill="#fff" stroke="#999" stroke-width="3"/><text x="850" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="central">CONTENT 2</text>
  <text x="150" y="514" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#222" text-anchor="start"><tspan font-weight="bold">Figure 1:</tspan> Main caption</text>
  <rect x="90" y="110" width="1020" height="464" rx="8" fill="none" stroke="#2e5090" stroke-width="4" stroke-dasharray="16 10"/><text x="102" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#2e5090">#fig-main</text>
</svg>
