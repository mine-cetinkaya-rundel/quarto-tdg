on:
  workflow_dispatch:
  
name: Execute Code and Open a PR with Freeze Updates

env:
  RUST_BACKTRACE: 1

jobs:
  execute-build-book:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # To install LaTeX to build PDF book
          tinytex: true
          # uncomment below and fill to pin a version
          # version: 0.9.105

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1
          
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python Packages
        run: uv sync --locked

      - name: Remove freezer
        run: |
          rm -rf _freeze/

      - name: Render book to all format
        # Add any command line argument needed
        run: |
          uv run quarto render

      - name: Open a PR with freeze updates
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: _freeze
          branch: freeze-update/${{ github.ref_name }}
          delete-branch: true
          commit-message: Update freeze files
          title: Update freeze files
          body: |
            This PR has the `_freeze/` files from a run of the workflow that executes all the code in the book.

            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
